<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Lista de Feira</title>
<meta name="description" content="Controle seus gastos na feira ou no mercado, direto do celular." />
<meta name="theme-color" content="#EA580C" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');
  body { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
  .ld-num { font-family: 'Space Mono', ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body class="bg-stone-200">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const STORAGE_KEY = 'estado-lista-de-feira';

function formatarMoeda(valor) {
  const numero = Number(valor) || 0;
  return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function gerarId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
}

function IconBasket(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
  );
}
function IconPlus(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...props}>
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  );
}
function IconTrash(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/><path d="M14 11v6"/>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>
  );
}
function IconPencil(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  );
}
function IconCheck(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  );
}
function IconX(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...props}>
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  );
}
function IconArrowLeft(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
  );
}
function IconRotateCcw(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><polyline points="3 3 3 8 8 8"/>
    </svg>
  );
}

function carregarEstadoInicial() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const dados = JSON.parse(raw);
      if (dados && dados.iniciado) {
        return {
          tela: 'carrinho',
          limiteDefinido: !!dados.limiteDefinido,
          limite: Number(dados.limite) || 0,
          itens: Array.isArray(dados.itens) ? dados.itens : [],
        };
      }
    }
  } catch (e) {}
  return { tela: 'inicio', limiteDefinido: false, limite: 0, itens: [] };
}

function App() {
  const inicial = useMemo(carregarEstadoInicial, []);
  const [tela, setTela] = useState(inicial.tela);
  const [limiteDefinido, setLimiteDefinido] = useState(inicial.limiteDefinido);
  const [limite, setLimite] = useState(inicial.limite);
  const [itens, setItens] = useState(inicial.itens);
  const [erroStorage, setErroStorage] = useState(false);

  const [novoNome, setNovoNome] = useState('');
  const [novaQtd, setNovaQtd] = useState('');
  const [novoValor, setNovoValor] = useState('');
  const [erroForm, setErroForm] = useState('');

  const [editandoId, setEditandoId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editQtd, setEditQtd] = useState('');
  const [editValor, setEditValor] = useState('');

  const [inputLimite, setInputLimite] = useState('');
  const [editandoLimite, setEditandoLimite] = useState(false);
  const [confirmNovaLista, setConfirmNovaLista] = useState(false);

  const persistir = (estado) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      setErroStorage(false);
    } catch (e) {
      setErroStorage(true);
    }
  };

  const totalGasto = useMemo(
    () => itens.reduce((soma, item) => soma + item.quantidade * item.valorUnitario, 0),
    [itens]
  );
  const restante = limite - totalGasto;
  const percentual = limiteDefinido && limite > 0 ? Math.min((totalGasto / limite) * 100, 100) : 0;
  const ultrapassouLimite = limiteDefinido && limite > 0 && totalGasto > limite;

  const handleComecar = () => { setInputLimite(''); setTela('limite'); };

  const handleConfirmarLimite = () => {
    const valor = parseFloat(inputLimite);
    const def = !isNaN(valor) && valor > 0;
    setLimiteDefinido(def);
    setLimite(def ? valor : 0);
    setTela('carrinho');
    persistir({ iniciado: true, limiteDefinido: def, limite: def ? valor : 0, itens });
  };

  const handlePularLimite = () => {
    setLimiteDefinido(false);
    setLimite(0);
    setTela('carrinho');
    persistir({ iniciado: true, limiteDefinido: false, limite: 0, itens });
  };

  const abrirEdicaoLimite = () => {
    setInputLimite(limiteDefinido ? String(limite) : '');
    setEditandoLimite(true);
  };

  const salvarNovoLimite = () => {
    const valor = parseFloat(inputLimite);
    const def = !isNaN(valor) && valor > 0;
    setLimiteDefinido(def);
    setLimite(def ? valor : 0);
    setEditandoLimite(false);
    persistir({ iniciado: true, limiteDefinido: def, limite: def ? valor : 0, itens });
  };

  const removerLimite = () => {
    setLimiteDefinido(false);
    setLimite(0);
    setEditandoLimite(false);
    persistir({ iniciado: true, limiteDefinido: false, limite: 0, itens });
  };

  const handleAdicionarItem = () => {
    const nome = novoNome.trim();
    const qtd = parseFloat(novaQtd);
    const valor = parseFloat(novoValor);
    if (!nome) { setErroForm('Digite o nome do produto.'); return; }
    if (!novaQtd || isNaN(qtd) || qtd <= 0) { setErroForm('Informe uma quantidade válida.'); return; }
    if (!novoValor || isNaN(valor) || valor < 0) { setErroForm('Informe um valor válido.'); return; }

    const novoItem = { id: gerarId(), nome, quantidade: qtd, valorUnitario: valor };
    const novosItens = [...itens, novoItem];
    setItens(novosItens);
    setNovoNome(''); setNovaQtd(''); setNovoValor(''); setErroForm('');
    persistir({ iniciado: true, limiteDefinido, limite, itens: novosItens });
  };

  const handleKeyDownNovoItem = (e) => { if (e.key === 'Enter') handleAdicionarItem(); };

  const handleRemoverItem = (id) => {
    const novosItens = itens.filter((item) => item.id !== id);
    setItens(novosItens);
    persistir({ iniciado: true, limiteDefinido, limite, itens: novosItens });
  };

  const iniciarEdicao = (item) => {
    setEditandoId(item.id);
    setEditNome(item.nome);
    setEditQtd(String(item.quantidade));
    setEditValor(String(item.valorUnitario));
  };
  const cancelarEdicao = () => setEditandoId(null);

  const edicaoValida =
    editNome.trim() && editQtd && !isNaN(parseFloat(editQtd)) && parseFloat(editQtd) > 0 &&
    editValor && !isNaN(parseFloat(editValor)) && parseFloat(editValor) >= 0;

  const salvarEdicao = (id) => {
    if (!edicaoValida) return;
    const novosItens = itens.map((item) =>
      item.id === id
        ? { ...item, nome: editNome.trim(), quantidade: parseFloat(editQtd), valorUnitario: parseFloat(editValor) }
        : item
    );
    setItens(novosItens);
    setEditandoId(null);
    persistir({ iniciado: true, limiteDefinido, limite, itens: novosItens });
  };

  const handleKeyDownEdicao = (e, id) => {
    if (e.key === 'Enter') salvarEdicao(id);
    if (e.key === 'Escape') cancelarEdicao();
  };

  const handleNovaLista = () => {
    setItens([]); setLimite(0); setLimiteDefinido(false);
    setConfirmNovaLista(false); setTela('inicio');
    persistir({ iniciado: false, limiteDefinido: false, limite: 0, itens: [] });
  };

  const inputClasse = 'w-full bg-transparent border-b-2 border-stone-300 focus:border-orange-500 outline-none py-2 transition-colors placeholder-stone-400';

  let conteudo;

  if (tela === 'inicio') {
    conteudo = (
      <div className="min-h-screen bg-orange-600 flex items-center justify-center px-8 text-center">
        <div className="w-full">
          <IconBasket className="w-11 h-11 text-white mx-auto mb-5" />
          <h1 className="text-4xl font-semibold text-white mb-3">Lista de Feira</h1>
          <p className="text-orange-50 mb-12 leading-relaxed">Adicione os produtos, veja o total na hora e não passe do limite.</p>
          <button onClick={handleComecar} className="bg-white text-orange-700 font-semibold py-3.5 px-10 rounded-full active:scale-95 transition-transform">
            Começar
          </button>
        </div>
      </div>
    );
  } else if (tela === 'limite') {
    conteudo = (
      <div className="min-h-screen bg-orange-600 flex flex-col px-6 pt-6 pb-10">
        <button onClick={() => setTela('inicio')} className="text-orange-100 hover:text-white flex items-center gap-1 text-sm mb-auto self-start">
          <IconArrowLeft className="w-4 h-4" /> Voltar
        </button>
        <div className="w-full">
          <h2 className="text-2xl font-semibold text-white mb-2">Qual o limite de gastos?</h2>
          <p className="text-orange-50 text-sm mb-8">Você acompanha quanto ainda pode gastar enquanto adiciona os produtos.</p>
          <div className="flex items-baseline gap-2 mb-8 border-b-2 border-orange-300 focus-within:border-white pb-2">
            <span className="text-2xl text-orange-100 ld-num">R$</span>
            <input type="number" inputMode="decimal" step="0.01" min="0" value={inputLimite}
              onChange={(e) => setInputLimite(e.target.value)} placeholder="0,00" autoFocus
              className="flex-1 min-w-0 bg-transparent outline-none text-3xl text-white placeholder-orange-200 ld-num" />
          </div>
          <button onClick={handleConfirmarLimite} disabled={!inputLimite || parseFloat(inputLimite) <= 0}
            className="w-full bg-white disabled:bg-orange-400 disabled:text-orange-100 text-orange-700 font-semibold py-3.5 rounded-full active:scale-95 transition-all mb-4">
            Confirmar
          </button>
          <button onClick={handlePularLimite} className="w-full text-orange-100 hover:text-white text-sm py-2 transition-colors">
            Continuar sem definir limite
          </button>
        </div>
      </div>
    );
  } else {
    conteudo = (
      <div className="pb-10">
        <div className="bg-orange-600 px-5 pt-6 pb-9 text-white">
          <div className="flex items-center justify-between mb-6">
            <h1 className="text-lg font-semibold">Lista de Feira</h1>
            <button onClick={() => setConfirmNovaLista(true)} className="text-orange-100 hover:text-white p-1.5" title="Nova lista">
              <IconRotateCcw className="w-5 h-5" />
            </button>
          </div>
          <p className="text-orange-100 text-sm mb-1">Total gasto</p>
          <p className="ld-num text-4xl font-bold mb-4">{formatarMoeda(totalGasto)}</p>
          {limiteDefinido ? (
            <div>
              <div className="w-full h-1.5 bg-orange-800 bg-opacity-40 rounded-full overflow-hidden mb-2">
                <div className={`h-full transition-all duration-500 ${ultrapassouLimite ? 'bg-red-300' : percentual > 70 ? 'bg-yellow-300' : 'bg-emerald-300'}`}
                  style={{ width: `${percentual}%` }} />
              </div>
              <div className="flex items-center justify-between text-sm">
                <button onClick={abrirEdicaoLimite} className="text-orange-100 hover:text-white flex items-center gap-1">
                  Limite {formatarMoeda(limite)}
                  <IconPencil className="w-3 h-3" />
                </button>
                <span className={ultrapassouLimite ? 'text-red-100 font-medium' : 'text-orange-50'}>
                  {ultrapassouLimite ? `excedeu ${formatarMoeda(Math.abs(restante))}` : `restam ${formatarMoeda(restante)}`}
                </span>
              </div>
            </div>
          ) : (
            <button onClick={abrirEdicaoLimite} className="text-orange-100 hover:text-white text-sm underline underline-offset-2">
              Definir limite de gastos
            </button>
          )}
        </div>

        <svg viewBox="0 0 20 6" preserveAspectRatio="none" className="w-full h-4 block relative" style={{ marginTop: '-16px' }}>
          <polygon points="0,6 2,0 4,6 6,0 8,6 10,0 12,6 14,0 16,6 18,0 20,6" fill="#FFFFFF" />
        </svg>

        {erroStorage && (
          <div className="mx-5 mb-3 bg-red-50 text-red-600 text-xs rounded-lg p-3">
            Não foi possível salvar agora. Verifique as configurações de privacidade do navegador.
          </div>
        )}

        <div className="px-5 mb-6">
          <p className="text-xs text-stone-400 mb-2">Adicionar produto</p>
          <input type="text" value={novoNome} onChange={(e) => setNovoNome(e.target.value)} onKeyDown={handleKeyDownNovoItem}
            placeholder="Nome do produto" className={`${inputClasse} text-base mb-3`} />
          <div className="flex items-end gap-3">
            <div className="w-20">
              <label className="text-xs text-stone-400">Qtd</label>
              <input type="number" inputMode="decimal" step="any" min="0" value={novaQtd}
                onChange={(e) => setNovaQtd(e.target.value)} onKeyDown={handleKeyDownNovoItem} placeholder="0"
                className={`${inputClasse} ld-num`} />
            </div>
            <div className="flex-1">
              <label className="text-xs text-stone-400">Valor unitário</label>
              <div className="flex items-baseline gap-1 border-b-2 border-stone-300 focus-within:border-orange-500 py-2 transition-colors">
                <span className="text-stone-400 ld-num text-sm">R$</span>
                <input type="number" inputMode="decimal" step="0.01" min="0" value={novoValor}
                  onChange={(e) => setNovoValor(e.target.value)} onKeyDown={handleKeyDownNovoItem} placeholder="0,00"
                  className="flex-1 min-w-0 bg-transparent outline-none ld-num placeholder-stone-400" />
              </div>
            </div>
            <button onClick={handleAdicionarItem}
              className="w-11 h-11 shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center active:scale-90 transition-all"
              title="Adicionar ao carrinho">
              <IconPlus className="w-5 h-5" />
            </button>
          </div>
          {erroForm && <p className="text-red-500 text-xs mt-2">{erroForm}</p>}
        </div>

        <div className="px-5">
          {itens.length === 0 ? (
            <div className="text-center py-12 text-stone-400 border-t border-dashed border-stone-300">
              <IconBasket className="w-8 h-8 mx-auto mb-3 opacity-50" />
              <p className="text-sm">Nenhum produto ainda.<br />Comece adicionando o primeiro item acima.</p>
            </div>
          ) : (
            <div className="bg-stone-50 rounded-2xl px-4">
              {itens.map((item, idx) => (
                <div key={item.id} className={idx !== itens.length - 1 ? 'border-b border-dashed border-stone-300' : ''}>
                  {editandoId === item.id ? (
                    <div className="py-3">
                      <input type="text" value={editNome} onChange={(e) => setEditNome(e.target.value)}
                        onKeyDown={(e) => handleKeyDownEdicao(e, item.id)} className={`${inputClasse} mb-2`} />
                      <div className="flex gap-3 mb-3">
                        <input type="number" inputMode="decimal" step="any" min="0" value={editQtd}
                          onChange={(e) => setEditQtd(e.target.value)} onKeyDown={(e) => handleKeyDownEdicao(e, item.id)}
                          placeholder="Qtd" className={`${inputClasse} ld-num w-20`} />
                        <input type="number" inputMode="decimal" step="0.01" min="0" value={editValor}
                          onChange={(e) => setEditValor(e.target.value)} onKeyDown={(e) => handleKeyDownEdicao(e, item.id)}
                          placeholder="Valor" className={`${inputClasse} ld-num flex-1`} />
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => salvarEdicao(item.id)} disabled={!edicaoValida}
                          className="flex-1 bg-emerald-600 disabled:bg-stone-300 text-white py-2 rounded-full flex items-center justify-center gap-1.5 text-sm font-medium">
                          <IconCheck className="w-4 h-4" /> Salvar
                        </button>
                        <button onClick={cancelarEdicao}
                          className="flex-1 bg-stone-200 text-stone-600 py-2 rounded-full flex items-center justify-center gap-1.5 text-sm font-medium">
                          <IconX className="w-4 h-4" /> Cancelar
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="py-3 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="text-stone-800 font-medium truncate">{item.nome}</p>
                        <p className="text-stone-400 text-xs ld-num mt-0.5">{item.quantidade} × {formatarMoeda(item.valorUnitario)}</p>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <span className="ld-num font-semibold text-stone-800 mr-1">{formatarMoeda(item.quantidade * item.valorUnitario)}</span>
                        <button onClick={() => iniciarEdicao(item)} className="text-stone-400 hover:text-orange-600 p-1.5">
                          <IconPencil className="w-4 h-4" />
                        </button>
                        <button onClick={() => handleRemoverItem(item.id)} className="text-stone-400 hover:text-red-600 p-1.5">
                          <IconTrash className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        {editandoLimite && (
          <div className="fixed inset-0 bg-stone-900 bg-opacity-50 flex items-end sm:items-center justify-center z-50" onClick={() => setEditandoLimite(false)}>
            <div className="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
              <h3 className="text-lg font-semibold text-stone-800 mb-5">Limite de gastos</h3>
              <div className="flex items-baseline gap-2 border-b-2 border-stone-300 focus-within:border-orange-500 pb-2 mb-6">
                <span className="text-stone-400 ld-num text-lg">R$</span>
                <input type="number" inputMode="decimal" step="0.01" min="0" value={inputLimite}
                  onChange={(e) => setInputLimite(e.target.value)} placeholder="0,00" autoFocus
                  className="flex-1 min-w-0 bg-transparent outline-none text-2xl ld-num" />
              </div>
              <div className="flex gap-2 mb-2">
                <button onClick={salvarNovoLimite} disabled={!inputLimite || parseFloat(inputLimite) <= 0}
                  className="flex-1 bg-orange-600 disabled:bg-stone-300 text-white font-semibold py-3 rounded-full">
                  Salvar
                </button>
                <button onClick={() => setEditandoLimite(false)} className="flex-1 bg-stone-100 text-stone-600 font-semibold py-3 rounded-full">
                  Cancelar
                </button>
              </div>
              {limiteDefinido && (
                <button onClick={removerLimite} className="w-full text-red-500 text-sm py-2">Remover limite</button>
              )}
            </div>
          </div>
        )}

        {confirmNovaLista && (
          <div className="fixed inset-0 bg-stone-900 bg-opacity-50 flex items-end sm:items-center justify-center z-50" onClick={() => setConfirmNovaLista(false)}>
            <div className="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm text-center" onClick={(e) => e.stopPropagation()}>
              <h3 className="text-lg font-semibold text-stone-800 mb-2">Começar uma nova lista?</h3>
              <p className="text-stone-500 text-sm mb-6">
                {itens.length > 0 ? `Isso vai apagar os ${itens.length} itens e o limite atual.` : 'Isso vai apagar o limite atual.'} Não é possível desfazer.
              </p>
              <div className="flex gap-2">
                <button onClick={() => setConfirmNovaLista(false)} className="flex-1 bg-stone-100 text-stone-600 font-semibold py-3 rounded-full">Cancelar</button>
                <button onClick={handleNovaLista} className="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-full">Apagar</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-stone-200">
      <div className="max-w-md mx-auto min-h-screen bg-white shadow-xl">{conteudo}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
